<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Wishes</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at bottom, #0a0a2a, #000);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
    }

    .wish {
        color: gold;
        font-size: clamp(1.8rem, 4vw, 3rem);
        font-weight: bold;
        text-align: center;
        padding: 25px 35px;
        margin: 20px;
        max-width: 90%;
        line-height: 1.4;
        opacity: 0;
        animation: showText 2s ease forwards;
        z-index: 10;
        text-shadow: 0 0 10px gold, 0 0 25px orange;
    }

    @keyframes showText {
        to {
            opacity: 1;
            transform: scale(1.05);
        }
    }

    /* Cracker particles */
    .cracker {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: explode 1.8s ease-out forwards;
    }

    @keyframes explode {
        from {
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }
        to {
            transform: translate(var(--x), var(--y)) scale(0);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="wish">
    🎉 Wishing you many many happy returns of the day Gota 🎉
</div>
<br/>
    <div class="wish">
    Love you so much maah gota 💝
</div>
<script>
    function createCrackers(xPos, yPos) {
        for (let i = 0; i < 150; i++) {   // 🔥 LOTS of crackers
            const cracker = document.createElement("div");
            cracker.classList.add("cracker");

            const x = (Math.random() - 0.5) * 600 + "px";
            const y = (Math.random() - 0.5) * 600 + "px";

            cracker.style.left = xPos + "px";
            cracker.style.top = yPos + "px";
            cracker.style.setProperty("--x", x);
            cracker.style.setProperty("--y", y);
            cracker.style.background =
                `hsl(${Math.random() * 360}, 100%, 60%)`;

            document.body.appendChild(cracker);
            setTimeout(() => cracker.remove(), 1800);
        }
    }

    // First big blast when text appears
    setTimeout(() => {
        createCrackers(window.innerWidth / 2, window.innerHeight / 2);
    }, 1800);

    // 🎆 Continuous crackers every second
    setInterval(() => {
        createCrackers(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight * 0.6
        );
    }, 1000);
</script>

</body>
</html>
